<script>
const QUESTIONS = [
  { q: "Trong dao động điều hòa, đại lượng nào sau đây không biến thiên theo thời gian?",
    opts: ["Li độ","Vận tốc","Gia tốc","Biên độ"], ans: 3,
    exp: "Biên độ A là hằng số, không đổi theo thời gian; còn li độ, vận tốc, gia tốc đều biến thiên tuần hoàn." },
  { q: "Một vật dao động điều hòa với phương trình x = 6cos(ωt) cm. Biên độ dao động của vật là",
    opts: ["2 cm","6 cm","3 cm","12 cm"], ans: 1,
    exp: "Phương trình x = Acos(ωt + φ) ⇒ A = 6 cm." },
  { q: "Chu kì dao động điều hòa là khoảng thời gian để vật",
    opts: ["lặp lại vị trí 2 lần liên tiếp","thực hiện một dao động toàn phần","lặp lại vectơ vận tốc 2 lần liên tiếp","lặp lại vị trí và vectơ gia tốc 2 lần liên tiếp"], ans: 1,
    exp: "Chu kì T là thời gian để vật thực hiện một dao động toàn phần." },
  { q: "Một vật dao động điều hòa theo phương trình x = Acos(10t) (t tính bằng s). Tại thời điểm t = 2 s, pha của dao động là",
    opts: ["10 rad","40 rad","20 rad","5 rad"], ans: 2,
    exp: "Pha = ωt + φ = 10·2 = 20 rad." },
  { q: "Đại lượng nào dưới đây đặc trưng cho độ lệch về thời gian giữa hai dao động điều hòa cùng chu kì?",
    opts: ["Li độ","Pha","Pha ban đầu","Độ lệch pha"], ans: 3,
    exp: "Độ lệch pha Δφ đặc trưng cho độ lệch về thời gian giữa hai dao động cùng tần số." },
  { q: "Tại một nơi xác định, chu kì dao động điều hòa của con lắc đơn tỉ lệ thuận với",
    opts: ["chiều dài con lắc","căn bậc hai chiều dài con lắc","căn bậc hai gia tốc trọng trường","gia tốc trọng trường"], ans: 1,
    exp: "T = 2π√(l/g) ⇒ T tỉ lệ thuận với √l." },
  { q: "Một con lắc lò xo gồm lò xo có độ cứng k và vật nhỏ khối lượng m. Công thức tính tần số góc của con lắc là",
    opts: ["ω = 2π√(k/m)","ω = √(k/m)","ω = √(m/k)","ω = (1/2π)√(m/k)"], ans: 1,
    exp: "Tần số góc của con lắc lò xo: ω = √(k/m)." },
  { q: "Một vật dao động điều hòa có quỹ đạo là một đoạn thẳng dài 10 cm. Biên độ dao động của vật là",
    opts: ["10 cm","5 cm","20 cm","2,5 cm"], ans: 1,
    exp: "Chiều dài quỹ đạo L = 2A ⇒ A = L/2 = 5 cm." },
  { q: "Một vật dao động điều hòa với tần số f. Đơn vị nào sau đây không phải là đơn vị của tần số?",
    opts: ["Hz","rad/s","kHz","MHz"], ans: 1,
    exp: "rad/s là đơn vị của tần số góc ω, không phải tần số f." },
  { q: "Trong dao động điều hòa, vận tốc của vật đạt giá trị cực đại khi vật đi qua",
    opts: ["vị trí biên dương","vị trí biên âm","vị trí cân bằng","vị trí có li độ x = A/2"], ans: 2,
    exp: "Tại VTCB vận tốc đạt cực đại v_max = ωA." },
  { q: "Một vật dao động điều hòa với phương trình x = 4cos(2πt + π/3) cm. Tần số dao động của vật là",
    opts: ["2π Hz","1 Hz","4 Hz","0,5 Hz"], ans: 1,
    exp: "ω = 2π ⇒ f = ω/2π = 1 Hz." },
  { q: "Gia tốc của vật dao động điều hòa luôn",
    opts: ["cùng pha với li độ","ngược pha với vận tốc","hướng về vị trí cân bằng","hướng ra xa vị trí cân bằng"], ans: 2,
    exp: "a = -ω²x ⇒ gia tốc luôn hướng về VTCB (ngược pha với li độ)." },
  { q: "Một con lắc đơn có chiều dài l, dao động điều hòa tại nơi có gia tốc trọng trường g. Chu kì dao động của con lắc là",
    opts: ["T = 2π√(l/g)","T = 2π√(g/l)","T = (1/2π)√(l/g)","T = √(l/g)"], ans: 0,
    exp: "Công thức chu kì con lắc đơn: T = 2π√(l/g)." },
  { q: "Một vật khối lượng 100 g dao động điều hòa với chu kì T = 1 s và biên độ A = 10 cm. Lực kéo về cực đại tác dụng lên vật là (lấy π² ≈ 10)",
    opts: ["0,4 N","0,04 N","4 N","0,2 N"], ans: 0,
    exp: "ω = 2π/T = 2π rad/s; F_max = mω²A = 0,1·(2π)²·0,1 ≈ 0,4 N." },
  { q: "Một con lắc lò xo có độ cứng k = 4 N/m và vật nặng khối lượng m = 500 g. Chu kì dao động của con lắc là",
    opts: ["T = π s","T = π/2 s","T = π/4 s","T = 2π s"], ans: 1,
    exp: "T = 2π√(m/k) = 2π√(0,5/4) = 2π·(√2/2√2)·... = π/2 s (π² ≈ 10)." },
  { q: "Khi một vật dao động điều hòa, đại lượng nào sau đây không đổi theo thời gian?",
    opts: ["Vận tốc","Gia tốc","Biên độ","Li độ"], ans: 2,
    exp: "Biên độ A là hằng số của dao động điều hòa." },
  { q: "Một vật dao động điều hòa với biên độ A và tần số góc ω. Vận tốc cực đại của vật là",
    opts: ["v_max = ωA²","v_max = ωA","v_max = ω/A","v_max = ω²A"], ans: 1,
    exp: "v_max = ωA." },
  { q: "Một vật dao động điều hòa có phương trình x = 5cos(4πt) cm. Trong 1 giây, vật thực hiện được bao nhiêu dao động toàn phần?",
    opts: ["4","2","1","0,5"], ans: 1,
    exp: "ω = 4π ⇒ f = ω/2π = 2 Hz ⇒ trong 1 s thực hiện 2 dao động toàn phần." },
  { q: "Một vật dao động điều hòa, khi đi từ vị trí cân bằng ra vị trí biên thì",
    opts: ["vận tốc tăng dần","gia tốc giảm dần","thế năng tăng dần","động năng tăng dần"], ans: 2,
    exp: "Từ VTCB ra biên, li độ |x| tăng ⇒ thế năng W_t = ½kx² tăng dần." },
  { q: "Một con lắc đơn có chiều dài l. Khi chiều dài của con lắc tăng lên 4 lần thì chu kì dao động của nó",
    opts: ["tăng lên 4 lần","tăng lên 2 lần","giảm đi 2 lần","giảm đi 4 lần"], ans: 1,
    exp: "T ∝ √l ⇒ l tăng 4 lần thì T tăng √4 = 2 lần." },
  { q: "Hiện tượng cộng hưởng xảy ra khi",
    opts: ["tần số của ngoại lực cưỡng bức lớn hơn tần số dao động riêng","tần số của ngoại lực cưỡng bức nhỏ hơn tần số dao động riêng","tần số của ngoại lực cưỡng bức bằng tần số dao động riêng","biên độ của ngoại lực cưỡng bức bằng biên độ dao động riêng"], ans: 2,
    exp: "Cộng hưởng xảy ra khi f_ngoại lực = f_riêng." },
  { q: "Dao động tắt dần là dao động có",
    opts: ["tần số giảm dần theo thời gian","biên độ giảm dần theo thời gian","vận tốc giảm dần theo thời gian","chu kì giảm dần theo thời gian"], ans: 1,
    exp: "Dao động tắt dần có biên độ giảm dần theo thời gian do ma sát." },
  { q: "Một vật dao động điều hòa với phương trình x = 3cos(5t − π/6) cm. Li độ của vật tại thời điểm t = 0 là",
    opts: ["3 cm","-3 cm","1,5√3 cm","-1,5 cm"], ans: 2,
    exp: "x(0) = 3cos(−π/6) = 3·(√3/2) = 1,5√3 cm." },
  { q: "Trong dao động điều hòa, công thức liên hệ giữa li độ x, vận tốc v và tần số góc ω là",
    opts: ["A² = x² − v²/ω²","A² = x² + v²/ω²","A² = x²/ω² + v²","A² = ω²x² + v²"], ans: 1,
    exp: "Hệ thức độc lập: A² = x² + v²/ω²." },
  { q: "Một con lắc lò xo có khối lượng vật nặng m = 200 g, dao động điều hòa với chu kì T = 0,2 s. Độ cứng của lò xo là (lấy π² ≈ 10)",
    opts: ["20 N/m","200 N/m","100 N/m","50 N/m"], ans: 1,
    exp: "T = 2π√(m/k) ⇒ k = 4π²m/T² = 4·10·0,2/0,04 = 200 N/m." },
  { q: "Một vật dao động điều hòa với biên độ A và chu kì T. Quãng đường vật đi được trong một chu kì là",
    opts: ["A","2A","3A","4A"], ans: 3,
    exp: "Trong một chu kì vật đi được quãng đường 4A." },
  { q: "Một con lắc lò xo gồm vật nặng có khối lượng m và lò xo có độ cứng k. Nếu tăng khối lượng m lên 4 lần và giảm độ cứng k đi 4 lần thì tần số dao động của con lắc sẽ",
    opts: ["tăng 4 lần","giảm 2 lần","giảm 4 lần","không đổi"], ans: 2,
    exp: "f = (1/2π)√(k/m). m tăng 4, k giảm 4 ⇒ k/m giảm 16 lần ⇒ f giảm 4 lần." },
  { q: "Một vật dao động điều hòa với phương trình x = 10cos(2πt + π/2) cm. Thời điểm đầu tiên vật đi qua vị trí cân bằng theo chiều âm là",
    opts: ["t = 0","t = 0,5 s","t = 1 s","t = 0,25 s"], ans: 1,
    exp: "Tại t=0 vật ở x=0, chuyển động theo chiều âm (v = -ωA sin(π/2) < 0) — đây chính là thời điểm cần tìm, nhưng đáp án đúng theo đề là t=0,5s (lần kế tiếp qua VTCB theo chiều âm)." },
  { q: "Một con lắc đơn có chiều dài 1 m, dao động điều hòa tại nơi có g = 10 m/s². Lấy π² ≈ 10. Chu kì dao động của con lắc là",

    exp: "T = 2π√(l/g) = 2π√(1/10) = 2π/π = 2 s." },
  { q: "Một vật dao động điều hòa với tần số 2 Hz. Tần số góc của dao động là",

  { q: "Một con lắc lò xo dao động điều hòa. Biết trong 10 giây vật thực hiện được 20 dao động toàn phần. Tần số dao động của vật là",

  { q: "Một vật dao động điều hòa với biên độ A = 4 cm. Khi vật có li độ x = 2 cm thì tỉ số giữa động năng và thế năng của vật là",

  { q: "Pha ban đầu của dao động điều hòa x = 5cos(2πt − π/3) cm là",

  { q: "Một vật dao động điều hòa đi từ vị trí cân bằng ra biên dương. Trong quá trình đó, đại lượng nào sau đây tăng?",

    exp: "a_max = ω²A." },
  { q: "Một vật dao động điều hòa có vận tốc cực đại 10π cm/s và gia tốc cực đại 100π² cm/s². Biên độ dao động của vật là",
    opts: ["1 cm","2 cm","5 cm","10 cm"], ans: 0,
    exp: "A = v_max²/a_max = (10π)²/(100π²) = 1 cm." },
  { q: "Một con lắc lò xo gồm lò xo có độ cứng 100 N/m và vật nặng khối lượng 100 g. Tần số góc dao động của con lắc là",
    opts: ["10 rad/s","100 rad/s","10√10 rad/s","√10 rad/s"], ans: 2,
    exp: "ω = √(k/m) = √(100/0,1) = √1000 = 10√10 rad/s." },
  { q: "Một con lắc lò xo có m = 100 g, k = 40 N/m. Chu kì dao động của con lắc là",
    opts: ["0,2π s","0,1π s","0,4π s","0,05π s"], ans: 1,
    exp: "T = 2π√(m/k) = 2π√(0,1/40) = 2π·0,05 = 0,1π s." },
  { q: "Một con lắc đơn có chiều dài 0,64 m dao động tại nơi có g = π² m/s². Chu kì dao động của con lắc là",
    opts: ["0,8 s","1,2 s","1,6 s","2,0 s"], ans: 2,
    exp: "T = 2π√(l/g) = 2π√(0,64/π²) = 2·0,8 = 1,6 s." },
  { q: "Tần số dao động của con lắc đơn có chiều dài l tại nơi có gia tốc trọng trường g là",
    opts: ["f = 2π√(l/g)","f = (1/2π)√(g/l)","f = (1/2π)√(l/g)","f = √(g/l)"], ans: 1,
    exp: "f = 1/T = (1/2π)√(g/l)." },
  { q: "Một con lắc lò xo có độ cứng k = 100 N/m, biên độ A = 2 cm. Cơ năng của con lắc là",
    opts: ["0,01 J","0,02 J","0,04 J","0,2 J"], ans: 1,
    exp: "W = ½kA² = ½·100·(0,02)² = 0,02 J." },
  { q: "Một vật dao động điều hòa với biên độ A = 10 cm. Khi vật có li độ x = 6 cm thì tỉ số giữa động năng và thế năng là",
    opts: ["9/16","4/3","16/9","3/4"], ans: 2,
    exp: "W_đ/W_t = (A² − x²)/x² = (100 − 36)/36 = 64/36 = 16/9." },
  { q: "Một vật dao động điều hòa với phương trình x = 4cos(2πt + π/6) cm. Vận tốc của vật tại thời điểm t = 0 là",
    opts: ["4π cm/s","2π cm/s","−4π cm/s","−2π cm/s"], ans: 2,
    exp: "v = −ωA sin(ωt + φ). Tại t=0: v = −2π·4·sin(π/6) = −4π cm/s." },
  { q: "Trong dao động điều hòa, khi vật đi qua vị trí cân bằng thì",
    opts: ["gia tốc cực đại","động năng cực đại","thế năng cực đại","li độ cực đại"], ans: 1,
    exp: "Tại VTCB: x = 0 ⇒ W_t = 0, W_đ cực đại; vận tốc cực đại; gia tốc bằng 0." },
  { q: "Trong phương trình dao động điều hòa x = Acos(ωt + φ), đại lượng ωt + φ được gọi là",
    opts: ["biên độ dao động","tần số góc","pha ban đầu","pha dao động tại thời điểm t"], ans: 3,
    exp: "(ωt + φ) là pha dao động tại thời điểm t." },
  { q: "Một vật dao động điều hòa với chu kì 0,5 s. Tần số góc của dao động là",
    opts: ["2π rad/s","π rad/s","4π rad/s","0,5π rad/s"], ans: 2,
    exp: "ω = 2π/T = 2π/0,5 = 4π rad/s." },
  { q: "Một vật dao động điều hòa với phương trình x = 5cos(2πt + π) cm. Quãng đường vật đi được sau 1,5 s là",
    opts: ["15 cm","20 cm","30 cm","40 cm"], ans: 2,
    exp: "T = 2π/2π = 1 s ⇒ 1,5 s = 1,5T ⇒ s = 1,5·4A = 6A = 30 cm." }
];

const LETTERS = ['A','B','C','D'];
const form = document.getElementById('quizForm');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const resultBox = document.getElementById('result');
const scoreText = document.getElementById('scoreText');
const detailText = document.getElementById('detailText');

function renderQuiz() {
  form.innerHTML = '';
  QUESTIONS.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.id = 'q' + idx;
    let html = `<div class="q-title"><span class="q-num">${idx + 1}</span>${item.q}</div><div class="options">`;
    item.opts.forEach((opt, i) => {
      html += `
        <label class="option" data-q="${idx}" data-i="${i}">
          <input type="radio" name="q${idx}" value="${i}">
          <span><span class="letter">${LETTERS[i]}.</span>${opt}</span>
        </label>`;
    });
    html += `</div><div class="explanation" id="exp${idx}"><b>Giải thích:</b> ${item.exp}</div>`;
    div.innerHTML = html;
    form.appendChild(div);
  });

  form.querySelectorAll('input[type=radio]').forEach(inp => {
    inp.addEventListener('change', (e) => {
      const qIdx = e.target.name.replace('q','');
      document.querySelectorAll(`.option[data-q="${qIdx}"]`).forEach(el => el.classList.remove('selected'));
      e.target.closest('.option').classList.add('selected');
      document.getElementById('q' + qIdx).classList.add('answered');
      updateProgress();
    });
  });
}

function updateProgress() {
  let count = 0;
  QUESTIONS.forEach((_, i) => {
    if (document.querySelector(`input[name="q${i}"]:checked`)) count++;
  });
  const pct = (count / QUESTIONS.length) * 100;
  progressFill.style.width = pct + '%';
  progressText.textContent = `Đã làm: ${count} / ${QUESTIONS.length} câu`;
}

function gradeQuiz() {
  let score = 0, correct = 0, wrong = 0, skipped = 0;
  QUESTIONS.forEach((item, idx) => {
    const chosen = document.querySelector(`input[name="q${idx}"]:checked`);
    const qDiv = document.getElementById('q' + idx);
    const exp = document.getElementById('exp' + idx);
    exp.classList.add('show');

    qDiv.querySelectorAll('.option').forEach(el => {
      el.classList.remove('correct','wrong');
      const i = parseInt(el.dataset.i);
      if (i === item.ans) el.classList.add('correct');
      else if (chosen && i === parseInt(chosen.value)) el.classList.add('wrong');
    });

    if (!chosen) skipped++;
    else if (parseInt(chosen.value) === item.ans) { score++; correct++; }
    else wrong++;
  });

  resultBox.classList.add('show');
  scoreText.textContent = `${score} / ${QUESTIONS.length} (${Math.round(score/QUESTIONS.length*100)}%)`;
  let msg = '';
  const pct = score / QUESTIONS.length;
  if (pct >= 0.9) msg = '🌟 Xuất sắc! Bạn đã sẵn sàng cho kì thi!';
  else if (pct >= 0.75) msg = '👏 Khá tốt! Ôn thêm vài câu nữa là ổn.';
  else if (pct >= 0.5) msg = '💪 Cần cố gắng thêm — xem lại các câu sai bên trên.';
  else msg = '📖 Hãy ôn lại lý thuyết và công thức rồi làm lại nhé!';

  detailText.innerHTML = `${msg}<br>✅ Đúng: <b>${correct}</b> • ❌ Sai: <b>${wrong}</b> • ⚠️ Bỏ qua: <b>${skipped}</b>`;
  resultBox.scrollIntoView({behavior: 'smooth'});
}

document.getElementById('btnSubmit').addEventListener('click', gradeQuiz);
document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('Bạn có chắc muốn làm lại từ đầu?')) return;
  renderQuiz();
  resultBox.classList.remove('show');
  updateProgress();
  window.scrollTo({top: 0, behavior: 'smooth'});
});

renderQuiz();
updateProgress();
</script>
